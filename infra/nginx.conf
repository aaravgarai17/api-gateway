events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolves "gateway" to every replica's IP.
    # Short TTL so replicas added/removed at runtime are picked up without a
    # reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            set $backend "http://gateway:8000";
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;

            # Retry another gateway replica on connection-level failure.
            # NOTE: deliberately does NOT include http_503 — a 503 from the
            # gateway is a *correct* circuit-breaker response, not a failure to
            # route around. Retrying it would defeat the breaker's purpose.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
